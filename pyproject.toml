[project]
name = "mcp-agent-tools"
version = "0.1.0"
description = "A bounded logistics assistant with MCP tools over stdio"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "sqlglot>=27,<32",
  "streamlit>=1.44,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
